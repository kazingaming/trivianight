# Trivia Night — Cloudflare Worker
#
# One Worker serves everything: the built client as static assets, the HTTP
# API, and the WebSocket upgrades. Authoritative game state lives in Durable
# Objects, which is what lets multiplayer be server-authoritative without a
# long-running server process.

name = "trivianight"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# The built client. Requests that match a file are served straight from the
# edge and never reach the Worker; anything else falls through to it, which is
# how /api and /ws get handled and how SPA routes are resolved.
[assets]
directory = "../web/dist"
binding = "ASSETS"
# Only ever serve a file that actually exists. Everything else — /api, /ws and
# every client-side route — falls through to the Worker, which decides. Without
# this the asset router would redirect deep links like /quick/duel before the
# Worker ever saw them.
html_handling = "none"
not_found_handling = "none"

# One instance per room, plus a single global matchmaker.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

# SQLite-backed Durable Objects are the class available on the Workers free
# plan. Do not change this to new_classes — that variant requires a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "MatchmakerDO"]

[observability]
enabled = true
